<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="./css/product.css" />
  </head>
  <body>
    <div class="header">
      <div class="nav">
        <div class="nav-brand" onclick="location.href='/'">
          The Morning Brew
        </div>
        <div class="nav-menu">
          <div>
            <span onclick="location.href='/'" style="cursor: pointer"
              >Home</span
            >
          </div>
          <div>
            <span
              onclick="location.href='/product.html'"
              style="cursor: pointer"
              >Products</span
            >
          </div>
          <div>
            <span onclick="location.href='/#about'" style="cursor: pointer"
              >About</span
            >
          </div>
          <div>
            <span onclick="location.href='/#contact'" style="cursor: pointer"
              >Contact</span
            >
          </div>
        </div>
      </div>
    </div>

    <div class="product-hero">
      <div class="product-hero-content">
        <div style="font-size: 3rem; margin-bottom: 16px; color: #2c1810">
          Signature Drinks
        </div>
        <div style="font-size: 1.2rem; color: #666">
          Handcrafted perfection in every cup
        </div>
      </div>
    </div>

    <div class="products-container">
      <div class="container">
        <div class="products-grid" id="productsGrid"></div>
      </div>
    </div>

    <div class="footer">
      <div class="container">
        <div>&copy; 2025 The Morning Brew. All rights reserved.</div>
      </div>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
      </div>
    </div>

    <script type="module" src="./js/product.js"></script>
  </body>
</html>
